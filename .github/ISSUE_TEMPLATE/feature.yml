name: Feature request
description: Propose a user problem or product improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What job is difficult today, for whom, and why?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Use synthetic examples only; exclude private professional data.
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: Note privacy, portability, complexity, or compatibility costs.
